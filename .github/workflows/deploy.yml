name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 중간에 끊기면 안 되므로 취소하지 않고 줄을 세운다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # PR 과 완전히 같은 검증을 거친 뒤에만 배포한다.
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      base-path: /${{ github.event.repository.name }}
      upload-pages-artifact: true

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
